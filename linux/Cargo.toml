[workspace]
resolver = "2"
members = ["crates/bettershot-core", "crates/bettershot-render", "crates/bettershot-platform", "crates/bettershot-app"]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/BoredYama/better-shot-linux"
rust-version = "1.92"

[workspace.dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "gtk4", "screenshot", "global_shortcuts", "screencast"] }
async-channel = "2"
bettershot-core = { path = "crates/bettershot-core" }
bettershot-platform = { path = "crates/bettershot-platform" }
bettershot-render = { path = "crates/bettershot-render" }
cairo-rs = { version = "0.22", features = ["png"] }
pango = { version = "0.22", features = ["v1_50"] }
pangocairo = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
gst = { version = "0.25", package = "gstreamer", features = ["v1_20"] }
gst-app = { version = "0.25", package = "gstreamer-app", features = ["v1_20"] }
gst-pbutils = { version = "0.25", package = "gstreamer-pbutils", features = ["v1_20"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
url = "2"
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

# Image processing in dependencies is unusably slow unoptimized; this keeps
# debug builds of BetterShot's own crates quick to compile and step through.
[profile.dev.package."*"]
opt-level = 2
# The renderer is per-pixel math (warps, blurs, compositing); unoptimized it
# makes the studio preview and the UI checks crawl.
[profile.dev.package.bettershot-render]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
