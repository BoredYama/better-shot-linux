[workspace]
resolver = "2"
members = ["crates/bettershot-core", "crates/bettershot-platform", "crates/bettershot-app"]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/BoredYama/better-shot-linux"
rust-version = "1.80"

[workspace.dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "gtk4", "screenshot", "global_shortcuts"] }
async-channel = "2"
bettershot-core = { path = "crates/bettershot-core" }
bettershot-platform = { path = "crates/bettershot-platform" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
