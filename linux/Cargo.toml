[workspace]
resolver = "2"
members = ["crates/bettershot-core"]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/BoredYama/better-shot-linux"
rust-version = "1.80"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
