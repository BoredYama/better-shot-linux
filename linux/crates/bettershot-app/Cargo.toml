[package]
name = "bettershot-app"
version = "0.5.9"
description = "BetterShot for Linux"
edition.workspace = true
# Scrolling capture adapts MacShot (GPLv3) and zoom planning adapts Cap (AGPLv3);
# see Resources/Licenses/MacShot.txt and Resources/Licenses/Cap.txt.
license = "BSD-3-Clause AND GPL-3.0-only AND AGPL-3.0-only"
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bettershot"
path = "src/main.rs"

[dependencies]
adw.workspace = true
async-channel.workspace = true
bettershot-core.workspace = true
bettershot-platform.workspace = true
bettershot-render.workspace = true
chrono.workspace = true
gtk.workspace = true
image.workspace = true
pangocairo.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
